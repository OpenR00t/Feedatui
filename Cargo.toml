[package]
name = "feedatui"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A terminal RSS/Atom feed reader with inline images"

[dependencies]
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
feed-rs = "3"
html2text = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5"
directories = "6"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
quick-xml = "0.42"
unicode-width = "0.2"
dom_smoothie = "0.18"
dom_query = "0.28"
toml_edit = "0.25"

# Windows uses its own TLS (SChannel); elsewhere rustls.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "gzip", "brotli", "deflate"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "deflate"] }

[profile.release]
lto = "thin"
strip = true
